<!-- ============ 开屏动画 ============ -->
<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <div class="splash-logo">
      <span class="splash-halo"></span>
      <svg class="splash-cloud" viewBox="0 0 100 64" aria-hidden="true">
        <path d="M27 57a18 18 0 0 1-1.5-35.9A26 26 0 0 1 74 15a17.5 17.5 0 0 1 3.5 42z" fill="#fff"/>
      </svg>
    </div>
    <div class="splash-name">云工作台</div>
    <div class="splash-tag">每一次打卡，都离上岸更近一步</div>
    <div class="splash-bar"><i></i></div>
  </div>
</div>
<style id="splashCss">
#splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#9d90cf 0%,#B2A8DC 50%,#C9C0EC 100%);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  transition:opacity .5s ease,transform .55s cubic-bezier(.2,.7,.3,1);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
#splash.hide{opacity:0;transform:scale(1.05);pointer-events:none;}
#splash.gone{display:none;}
.splash-inner{display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;
  animation:spIn .6s ease both;}
.splash-logo{position:relative;width:98px;height:98px;margin-bottom:24px;display:flex;align-items:center;justify-content:center;}
.splash-halo{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.92);animation:spHalo 1.8s ease-out forwards;}
.splash-cloud{position:relative;width:64px;height:41px;opacity:0;
  animation:spCloudIn .7s .15s ease-out forwards,spFloat 3.2s 1s ease-in-out infinite;}
.splash-name{font-size:27px;font-weight:800;letter-spacing:4px;opacity:0;animation:spUp .6s .5s ease forwards;}
.splash-tag{margin-top:11px;font-size:13px;opacity:0;letter-spacing:1px;animation:spUp .6s .72s ease forwards;}
.splash-bar{margin-top:32px;width:148px;height:3px;border-radius:3px;background:rgba(255,255,255,.32);overflow:hidden;}
.splash-bar i{display:block;height:100%;width:0;background:#fff;border-radius:3px;animation:spBar 1.5s ease forwards;}
@keyframes spHalo{0%{transform:scale(.65);opacity:.55}100%{transform:scale(1.2);opacity:0}}
@keyframes spCloudIn{0%{opacity:0;transform:translateY(18px) scale(.88)}100%{opacity:1;transform:none}}
@keyframes spFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spIn{from{opacity:0}to{opacity:1}}
@keyframes spBar{to{width:100%}}
@media (prefers-reduced-motion:reduce){
  #splash,#splash *{animation:none!important;}
  .splash-name,.splash-tag{opacity:1;}
  .splash-cloud{opacity:1;}
  .splash-halo{opacity:0;}
  .splash-bar i{width:100%;}
}
</style>
<script>
(function(){
  var s=document.getElementById('splash');
  if(!s)return;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function hide(){s.classList.add('hide');setTimeout(function(){s.classList.add('gone');},520);}
  if(reduce){hide();return;}
  var start=Date.now();
  function done(){var wait=Math.max(0,1450-(Date.now()-start));setTimeout(hide,wait);}
  if(document.readyState==='complete')done();else window.addEventListener('load',done);
})();
</script>
